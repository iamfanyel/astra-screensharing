<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>astra - screensharing</title>
  <meta name="description" content="Share your screen and audio in a private room. No install, no account, peer to peer." />
  <meta name="color-scheme" content="dark light" />

  <!-- Open Graph / Facebook / Discord / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://astrascreen.live/" />
  <meta property="og:title" content="Astra — Screen and Audio Sharing" />
  <meta property="og:description" content="Share your screen and audio in a private room. No install, no account, peer to peer." />
  <meta property="og:image" content="https://astrascreen.live/astrabanner.png" />
  <meta property="og:image:secure_url" content="https://astrascreen.live/astrabanner.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="2400" />
  <meta property="og:image:height" content="1350" />
  <meta property="og:image:alt" content="Astra Screensharing" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://astrascreen.live/" />
  <meta name="twitter:title" content="Astra — Screen and Audio Sharing" />
  <meta name="twitter:description" content="Share your screen and audio in a private room. No install, no account, peer to peer." />
  <meta name="twitter:image" content="https://astrascreen.live/astrabanner.png" />
  <meta name="twitter:image:alt" content="Astra Screensharing" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/theme.js"></script>
  <!-- What the friends bar should look like, settled before the first paint:
       whether there is a list at all - a guest has none, see js/friends.js -
       and whether it was left folded. Written here rather than by js/lobby.js
       so neither state is drawn wrongly and then corrected. The keys are
       js/discord.js's and js/lobby.js's own. -->
  <script>
    (function () {
      try {
        var root = document.documentElement;
        if (localStorage.getItem('astra:discord:token')) root.classList.add('has-friends');
        root.dataset.friends = localStorage.getItem('astra:friends-open') === 'closed' ? 'closed' : 'open';
      } catch (_) {}
    })();
  </script>
  <!-- The room needs PeerJS from a CDN and a socket to the signalling broker.
       Warming both here means the lobby pays the DNS and TLS cost while someone
       is still reading the page, instead of it landing on the join. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://0.peerjs.com" />
  <link rel="preload" as="script" crossorigin
        href="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body class="lobby">
  <!-- The desktop app's title bar. Hidden in a browser, which draws its own;
       shown by the `is-desktop-app` class the Electron preload sets. -->
  <div class="titlebar" aria-hidden="true">
    <img class="titlebar-mark" src="/astralogo.png" alt="" width="1920" height="1920" />
    <span>astra</span>
  </div>
  <!-- Desktop app only, and only once an update has finished downloading.
       Below the title bar rather than in it: Windows draws the window buttons
       over that strip's right-hand end, which is where this would land.
       See js/desktop-update.js. -->
  <button id="apply-update" class="chip chip-icon-btn chip-update chip-update-corner" title="Update Astra" aria-label="Update Astra and restart" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
      <polyline points="7 10 12 15 17 10" />
      <line x1="12" y1="15" x2="12" y2="3" />
    </svg>
  </button>
  <div class="bg-glow-sphere" aria-hidden="true"></div>

  <!-- The strip across the top: who you are and what this is, kept out of the
       way of the two things the page is actually for. -->
  <header class="lobby-bar">
    <div class="lobby-bar-brand">
      <img class="brand-mark small" src="/astralogo.png" alt="" width="1920" height="1920" />
      <span>astra</span>
    </div>

    <div class="lobby-bar-side">
      <button type="button" id="bar-profile" class="bar-profile" title="Your profile" aria-label="Your profile">
        <span id="bar-avatar" class="avatar"></span>
      </button>
    </div>
  </header>

  <main class="lobby-main">
    <div class="lobby-stage">
      <!-- The two things the page is for: start a room, or go to one. -->
      <section class="lobby-hero">
        <header class="brand">
          <img class="logo" src="astralogo.png" alt="" width="1920" height="1920" />
          <h1>astra</h1>
        </header>
        <p class="tagline">Share your screen and audio with anyone.<br />Peer to peer, no install, no account.</p>

        <form id="create-form" autocomplete="off" onsubmit="return false">
          <button class="btn btn-primary btn-block btn-hero" type="submit">
            <span>create a room</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>
        </form>

        <div class="divider"><span>or join one</span></div>

        <form id="join-form" class="join-row" autocomplete="off" onsubmit="return false">
          <input id="code" class="code-input" type="text" maxlength="6" required
                 placeholder="room code" aria-label="Room code" spellcheck="false" />
          <button class="btn join-go" type="submit">
            <span>Join</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>
        </form>

        <p id="error" class="error" role="alert" hidden></p>

        <!-- The desktop build. Hidden inside the app itself, which is already it,
             and inside the Android app, where a Windows installer is no use.
             js/desktop-download.js does the hiding, and points this straight at
             the installer so it downloads on the first click. -->
        <a id="get-desktop" class="get-desktop" href="https://github.com/iamfanyel/astra-screensharing/releases/latest" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M3 5.7 10 4.75v6.6H3zM11 4.6 21 3.2v8.15H11zM3 12.35h7v6.6L3 18zM11 12.35h10V20.8l-10-1.4z" />
          </svg>
          <span>Download for Windows</span>
        </a>
      </section>

      <!-- The friends sidebar, positioned directly alongside the main card. -->
      <aside id="friends-rail" class="friends-rail">
        <section id="friends" class="friends">
          <div class="friends-head">
            <h2 class="friends-title">
              <span class="friends-word">Friends</span>
              <!-- Filled by js/lobby.js. On a phone the tab below already says
                   Friends, so this is what that line carries instead. -->
              <span id="friends-count" class="friends-count"></span>
            </h2>
            <button type="button" id="friends-toggle" class="icon-btn friends-toggle"
                    title="Hide friends" aria-label="Hide friends" aria-expanded="true" aria-controls="friends-list">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2.5" />
                <path d="M14 4v16" />
              </svg>
            </button>
          </div>
          <ul id="friends-list" class="friends-list"></ul>
        </section>
      </aside>
    </div>
  </main>

  <!-- A phone has no width for a bar beside the page, so the two become two
       views and this switches them. Hidden on a desktop, and for a guest,
       who has no friends list to switch to. -->
  <nav id="mobile-tabs" class="mobile-tabs" aria-label="Sections">
    <button type="button" class="mobile-tab is-on" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5" />
        <path d="M5 9.8V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.8" />
      </svg>
      <span>Home</span>
    </button>
    <button type="button" class="mobile-tab" data-tab="friends">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
      </svg>
      <span>Friends</span>
    </button>
  </nav>

  <div id="profile-modal" class="profile-modal" role="dialog" aria-modal="true" aria-label="Edit Profile" hidden>
    <div class="profile-modal-backdrop" id="profile-modal-backdrop"></div>

    <div class="profile-modal-dialog">
      <div class="profile-card" id="profile-card">
        <button type="button" id="profile-modal-close" class="profile-close-btn" aria-label="Close profile editor">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>

        <!-- Banner Container -->
        <div class="profile-banner-container">
          <div id="profile-modal-banner" class="profile-banner"></div>
          <div class="profile-banner-overlay">
            <button type="button" id="banner-change-btn" class="avatar-action" title="Change banner" aria-label="Change banner">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.4-2h7.8l1.4 2h2.2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z" />
                <circle cx="12" cy="13" r="3.4" />
              </svg>
            </button>
            <button type="button" id="banner-clear-btn" class="avatar-action" title="Remove banner" aria-label="Remove banner" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 7h16M10 7V5h4v2M6.5 7l.9 12.1A1 1 0 0 0 8.4 20h7.2a1 1 0 0 0 1-.9L17.5 7M10 11v5M14 11v5" />
              </svg>
            </button>
          </div>
          <input id="banner-file" type="file" accept="image/*" class="sr-only" />
        </div>

        <!-- Avatar Overlapping Banner -->
        <div class="profile-header-content">
          <div class="profile-avatar-wrapper">
            <span id="profile-modal-avatar" class="avatar avatar-xl"></span>
            <div class="profile-avatar-overlay">
              <button type="button" id="profile-avatar-change" class="avatar-action" title="Change picture" aria-label="Change picture">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.4-2h7.8l1.4 2h2.2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z" />
                  <circle cx="12" cy="13" r="3.4" />
                </svg>
              </button>
              <button type="button" id="profile-avatar-clear" class="avatar-action" title="Remove picture" aria-label="Remove picture" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 7h16M10 7V5h4v2M6.5 7l.9 12.1A1 1 0 0 0 8.4 20h7.2a1 1 0 0 0 1-.9L17.5 7M10 11v5M14 11v5" />
                </svg>
              </button>
            </div>
            <input id="profile-avatar-file" type="file" accept="image/*" class="sr-only" />
          </div>
          <div id="profile-modal-user-badges" class="profile-user-badges" hidden></div>
          <button type="button" id="profile-view-card" class="profile-view-card-btn" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="3" />
              <circle cx="9" cy="10" r="2" />
              <line x1="15" y1="8" x2="17" y2="8" />
              <line x1="15" y1="12" x2="17" y2="12" />
              <line x1="7" y1="16" x2="17" y2="16" />
            </svg>
            <span>View Card</span>
          </button>
        </div>

        <!-- Body: Name & Actions -->
        <div class="profile-card-body">
          <label class="field">
            <span>Display Name</span>
            <input id="name" type="text" maxlength="32" placeholder="Your name" />
          </label>

          <div id="discord-auth" class="discord-auth">
            <button type="button" id="discord-connect" class="btn btn-discord btn-block">
              <svg class="discord-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
              <span>Connect with Discord</span>
            </button>
            <div id="discord-connected" class="discord-badge" hidden>
              <svg class="discord-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
              <div class="discord-badge-info">
                <span class="discord-badge-label">Connected as</span>
                <span id="discord-username" class="discord-badge-user">@username</span>
              </div>
              <button type="button" id="discord-disconnect" class="discord-disconnect-btn" title="Disconnect Discord account">Disconnect</button>
            </div>
          </div>

          <div class="profile-modal-actions">
            <button type="button" id="profile-modal-save" class="btn btn-primary btn-block">Apply</button>
          </div>
        </div>
      </div>

      <!-- Your own card: raised when clicking "View card". -->
      <aside class="profile-card profile-invite" id="profile-invite" hidden aria-label="Your card">
        <div class="profile-invite-banner-wash" id="profile-invite-banner" aria-hidden="true"></div>
        <div class="profile-invite-surface-overlay" aria-hidden="true"></div>

        <div class="profile-invite-header">
          <button type="button" id="profile-invite-back" class="profile-close-btn profile-invite-nav-btn" title="Back to profile editor" aria-label="Back to profile editor">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="19" y1="12" x2="5" y2="12" />
              <polyline points="12 19 5 12 12 5" />
            </svg>
          </button>
          <button type="button" id="profile-invite-close" class="profile-close-btn profile-invite-nav-btn" title="Close" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>

        <div class="profile-invite-body">
          <div class="profile-invite-title-row">
            <h2 class="profile-invite-title">YOUR CARD</h2>
            <button type="button" id="profile-invite-copy" class="profile-invite-copy-btn" title="Copy link" aria-label="Copy link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
              </svg>
            </button>
          </div>
          <div class="profile-invite-code" id="profile-invite-code">
            <div class="profile-invite-spinner" aria-label="Loading"></div>
          </div>
          <div class="profile-invite-brand">
            <img class="profile-invite-logo" src="astralogo.png" alt="" width="22" height="22" />
            <span class="profile-invite-brand-name">astra</span>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
  <script src="js/platform.js"></script>
  <script src="js/config.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/native-app.js"></script>
  <script src="js/discord.js"></script>
  <script src="js/friends.js"></script>
  <script src="js/invite-card.js"></script>
  <script src="js/lobby.js"></script>
  <script src="js/desktop-update.js"></script>
  <script src="js/desktop-download.js"></script>
</body>
</html>
