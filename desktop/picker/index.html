<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Local document, local script, data: thumbnails, nothing else. `file:` is
       spelled out beside 'self' because a file:// page has an opaque origin,
       which 'self' alone does not match. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self' file:;" />
  <title>Screen Share</title>
  <style>
    /* Astra's neutrals, written out rather than tinted: this window is its own
       document and never sees the variables the site sets on :root. */
    :root {
      --bg: hsl(0 0% 7.84%);
      --panel: hsl(0 0% 11.76%);
      --raised: hsl(0 0% 14.12%);
      --line: hsl(0 0% 18.04%);
      --text: hsl(0 0% 93.33%);
      --muted: hsl(0 0% 61.96%);
      --accent: hsl(0 0% 83.92%);
      --accent-ink: hsl(0 0% 7.84%);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      cursor: default;
      overflow: hidden;
    }

    header {
      flex: none;
      padding: 14px 16px 10px;
    }

    /* One pill holding both segments, the way the app's own controls sit. */
    .segments {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 4px;
      padding: 4px;
      border-radius: 12px;
      background: var(--panel);
    }

    .segment {
      appearance: none;
      border: 0;
      border-radius: 9px;
      padding: 9px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.14s ease, color 0.14s ease;
    }

    .segment svg { width: 16px; height: 16px; flex: none; }

    .segment:hover { color: var(--text); }

    .segment.is-active {
      background: var(--raised);
      color: var(--text);
    }

    main {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 6px 16px 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px 14px;
      align-content: start;
    }

    main::-webkit-scrollbar { width: 6px; }
    main::-webkit-scrollbar-track { background: transparent; }
    main::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
    }
    main::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.32); }

    .source {
      appearance: none;
      border: 0;
      padding: 0;
      background: none;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      /* A button's UA style centres its flex children, which left every card
         hugging its own thumbnail: the capture API returns each one scaled to
         fit 320x180, so a tall window comes back narrower than a wide one and
         no two cards lined up. Stretching them makes every frame the width of
         its column, and the 16:9 box below does the rest. */
      align-items: stretch;
      gap: 9px;
      min-width: 0;
    }

    .thumb-frame {
      position: relative;
      border-radius: 10px;
      padding: 3px;
      background: transparent;
      transition: background 0.14s ease;
    }

    .thumb {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      border-radius: 8px;
      background: #000;
    }

    .source:hover .thumb-frame,
    .source:focus-visible .thumb-frame {
      background: var(--raised);
    }

    /* The action, written on the thing it acts on.
       A whole card is a big target but a silent one - nothing on it says that
       clicking shares, and a picker is exactly where you want to be sure
       before you click. This appears under the pointer, over the screen it
       belongs to, and says so. */
    .share-now {
      position: absolute;
      inset: 3px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.14s ease;
      /* The card underneath takes the click; this is only ever a label. */
      pointer-events: none;
    }

    .source:hover .share-now,
    .source:focus-visible .share-now {
      opacity: 1;
    }

    .share-now span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 16px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 13px;
      font-weight: 600;
      transform: translateY(4px);
      transition: transform 0.14s ease;
    }

    .source:hover .share-now span,
    .source:focus-visible .share-now span {
      transform: none;
    }

    .share-now svg { width: 15px; height: 15px; }

    .source:focus-visible {
      outline: none;
    }

    .label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 3px;
      min-width: 0;
    }

    .label img {
      width: 18px;
      height: 18px;
      flex: none;
      border-radius: 4px;
    }

    .label span {
      min-width: 0;
      font-size: 13px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 56px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* Across the top of the grid, when a monitor could not be listed. Quiet,
       because the screens below it are still the point of this window. */
    .notice {
      grid-column: 1 / -1;
      margin: 0 0 2px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    /* What you are about to share at, on the left; the way out on the right -
       the same division the app's own dialogs use. */
    footer {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px 14px;
    }

    .settings-wrap {
      position: relative;
      min-width: 0;
    }

    .settings-wrap[hidden] { display: none; }

    /* Settings sit where the read-out used to: same corner, same information,
       but now you can change it without closing the picker first.
       Built like the Cancel button opposite it, because it is one - a control
       with no surface until you happen to touch it reads as a caption, and
       nobody goes looking for settings in a caption. */
    .gear {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 9px 14px 9px 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      font: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--panel);
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease;
    }

    .gear:hover,
    .gear[aria-expanded="true"] {
      background: var(--line);
      color: var(--text);
    }

    .gear svg { width: 16px; height: 16px; flex: none; }

    .gear-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Upwards, because there is no room below it. */
    .panel {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      z-index: 5;
      min-width: 232px;
      padding: 8px;
      border-radius: 12px;
      background: var(--raised);
      border: 1px solid var(--line);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
    }

    .panel[hidden] { display: none; }

    .panel-title {
      margin: 4px 8px 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .option {
      appearance: none;
      border: 0;
      width: 100%;
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font: inherit;
      font-size: 13px;
      color: var(--text);
      background: none;
      cursor: pointer;
      text-align: left;
    }

    .option:hover { background: rgba(255, 255, 255, 0.07); }

    .option svg {
      width: 15px;
      height: 15px;
      flex: none;
      opacity: 0;
    }

    .option.is-selected svg { opacity: 1; }

    .panel-divider {
      height: 1px;
      margin: 7px 4px;
      background: var(--line);
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .toggle:hover { background: rgba(255, 255, 255, 0.07); }

    .toggle input {
      appearance: none;
      flex: none;
      width: 34px;
      height: 20px;
      margin: 0;
      border-radius: 999px;
      background: var(--line);
      position: relative;
      cursor: pointer;
      transition: background 0.14s ease;
    }

    .toggle input::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text);
      transition: transform 0.14s ease;
    }

    .toggle input:checked { background: var(--accent); }
    .toggle input:checked::after { transform: translateX(14px); background: var(--accent-ink); }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 9px 18px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      background: var(--panel);
      color: var(--text);
      transition: background 0.14s ease;
    }

    .btn:hover { background: var(--line); }
  </style>
</head>
<body>
  <header>
    <div class="segments" role="tablist">
      <button type="button" class="segment is-active" data-kind="screen" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="3" width="20" height="14" rx="2" />
          <path d="M8 21h8M12 17v4" />
        </svg>
        <span>Entire screen</span>
      </button>
      <button type="button" class="segment" data-kind="window" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M3 9h18" />
        </svg>
        <span>Applications</span>
      </button>
    </div>
  </header>

  <main id="sources" role="listbox" aria-label="Capture sources"></main>

  <footer>
    <div class="settings-wrap" id="settings-wrap" hidden>
      <button type="button" class="gear" id="settings-toggle" aria-expanded="false" aria-controls="settings" aria-haspopup="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        <span class="gear-label" id="settings-summary"></span>
      </button>

      <div class="panel" id="settings" hidden role="dialog" aria-label="Share settings">
        <p class="panel-title">Quality</p>
        <div id="quality-options"></div>
        <div class="panel-divider" id="audio-divider"></div>
        <label class="toggle" id="audio-row">
          <span>Share system audio</span>
          <input type="checkbox" id="share-audio" />
        </label>
      </div>
    </div>
    <button type="button" class="btn" id="cancel">Cancel</button>
  </footer>

  <script src="picker.js"></script>
</body>
</html>
