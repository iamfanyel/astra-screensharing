<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Local document, local script, data: thumbnails, nothing else. `file:` is
       spelled out beside 'self' because a file:// page has an opaque origin,
       which 'self' alone does not match. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self' file:;" />
  <title>Screen Share</title>
  <style>
    /* Astra's neutrals, written out rather than tinted: this window is its own
       document and never sees the variables the site sets on :root. */
    :root {
      --bg: hsl(0 0% 7.84%);
      --panel: hsl(0 0% 11.76%);
      --raised: hsl(0 0% 14.12%);
      --line: hsl(0 0% 18.04%);
      --text: hsl(0 0% 93.33%);
      --muted: hsl(0 0% 61.96%);
      --accent: hsl(0 0% 83.92%);
      --accent-ink: hsl(0 0% 7.84%);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      cursor: default;
      overflow: hidden;
    }

    header {
      flex: none;
      padding: 14px 16px 10px;
    }

    /* One pill holding both segments, the way the app's own controls sit. */
    .segments {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 4px;
      padding: 4px;
      border-radius: 12px;
      background: var(--panel);
    }

    .segment {
      appearance: none;
      border: 0;
      border-radius: 9px;
      padding: 9px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.14s ease, color 0.14s ease;
    }

    .segment svg { width: 16px; height: 16px; flex: none; }

    .segment:hover { color: var(--text); }

    .segment.is-active {
      background: var(--raised);
      color: var(--text);
    }

    main {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 6px 16px 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px 14px;
      align-content: start;
    }

    main::-webkit-scrollbar { width: 6px; }
    main::-webkit-scrollbar-track { background: transparent; }
    main::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
    }
    main::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.32); }

    .source {
      appearance: none;
      border: 0;
      padding: 0;
      background: none;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      /* A button's UA style centres its flex children, which left every card
         hugging its own thumbnail: the capture API returns each one scaled to
         fit 320x180, so a tall window comes back narrower than a wide one and
         no two cards lined up. Stretching them makes every frame the width of
         its column, and the 16:9 box below does the rest. */
      align-items: stretch;
      gap: 9px;
      min-width: 0;
    }

    .thumb-frame {
      position: relative;
      border-radius: 10px;
      padding: 3px;
      background: transparent;
      transition: background 0.14s ease;
    }

    .thumb {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      border-radius: 8px;
      background: #000;
    }

    .source:hover .thumb-frame,
    .source:focus-visible .thumb-frame {
      background: var(--raised);
    }

    .source:focus-visible {
      outline: none;
    }

    .label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 3px;
      min-width: 0;
    }

    .label img {
      width: 18px;
      height: 18px;
      flex: none;
      border-radius: 4px;
    }

    .label span {
      min-width: 0;
      font-size: 13px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 56px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* What you are about to share at, on the left; the way out on the right -
       the same division the app's own dialogs use. */
    footer {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px 14px;
    }

    .quality {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .quality-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .quality-detail {
      font-size: 12px;
      color: var(--muted);
    }

    .quality[hidden] { display: none; }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 9px 18px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      background: var(--panel);
      color: var(--text);
      transition: background 0.14s ease;
    }

    .btn:hover { background: var(--line); }
  </style>
</head>
<body>
  <header>
    <div class="segments" role="tablist">
      <button type="button" class="segment is-active" data-kind="screen" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="3" width="20" height="14" rx="2" />
          <path d="M8 21h8M12 17v4" />
        </svg>
        <span>Entire screen</span>
      </button>
      <button type="button" class="segment" data-kind="window" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M3 9h18" />
        </svg>
        <span>Applications</span>
      </button>
    </div>
  </header>

  <main id="sources" role="listbox" aria-label="Capture sources"></main>

  <footer>
    <div class="quality" id="quality" hidden>
      <span class="quality-name">Quality</span>
      <span class="quality-detail" id="quality-detail"></span>
    </div>
    <button type="button" class="btn" id="cancel">Cancel</button>
  </footer>

  <script src="picker.js"></script>
</body>
</html>
